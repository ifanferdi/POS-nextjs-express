services:
  api:
    image: ghcr.io/ifanferdi/pos-nextjs-express/api:latest
    container_name: pos-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_PORT: '3000'
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    container_name: pos-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
