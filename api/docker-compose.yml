services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: expressjs
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d expressjs']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    build: ./plugins/rabbitmq
    container_name: pos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    container_name: pos-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/expressjs;
      mc anonymous set public local/expressjs;
      echo 'Bucket created.';
      exit 0;
      "

  api:
    build: .
    container_name: pos-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      APP_NAME: ExpressJS-POS
      APP_ENV: development
      APP_PORT: 3000
      APP_URL: http://localhost:3000

      DB_USER: postgres
      DB_PASS: 1234
      DB_NAME: expressjs
      DB_HOST: postgres
      DB_PORT: 5432

      REDIS_URL: redis://redis:6379

      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: exchange

      FILESYSTEM: s3
      STORAGE_SECRET: supersecretstoragekey
      S3_REGION: us-east-1
      S3_ACCESS: minioadmin
      S3_SECRET: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: expressjs

      AUTH_MODE: stateful
      AUTH_TOKEN_TIMEOUT: 1d
      AUTH_REFRESH_TOKEN_TIMEOUT: 604800000 # 7 days in milliseconds

      HASH_SECRET: zN6p9JfG@!Xc7vR2Ls$wq04Mb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
