openapi: 3.0.3
info:
  title: POS API
  version: 1.0.0
  description: |
    Point of Sale API — Product Categories, Products, Orders, Payments, Dashboard, Users, Roles, Permissions.
    Base URL: `http://localhost:8000/api/v1`

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Dashboard
    description: POS dashboard statistics
  - name: Users
    description: User management
  - name: Roles
    description: Role management
  - name: Permissions
    description: Permission management
  - name: Product Categories
    description: Product category CRUD
  - name: Products
    description: Product CRUD with soft delete and image upload
  - name: Orders
    description: Order management with items and status
  - name: Payments
    description: Payment management for orders

paths:
  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════
  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Returns user + JWT token. In stateful mode (AUTH_MODE=stateful), also returns refreshToken and tokenExpiry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 255
                password:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Signed in successfully (stateless mode by default)
          content:
            application/json:
              schema:
                type: object
                required: [message, token, user]
                properties:
                  message:
                    type: string
                    example: Success
                  token:
                    type: string
                  refreshToken:
                    type: string
                    description: Only returned in stateful mode
                  tokenExpiry:
                    type: number
                    description: Only returned in stateful mode
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Sign out
      description: In stateless mode this is a no-op; in stateful mode destroys the token pair in Redis.
      responses:
        '200':
          description: Signed out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Only available in stateful mode (AUTH_MODE=stateful).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: The refresh token from sign-in
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                required: [message, token, refreshToken, exp, user]
                properties:
                  message:
                    type: string
                    example: Success
                  token:
                    type: string
                  refreshToken:
                    type: string
                  exp:
                    type: number
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════════════════════
  # DASHBOARD
  # ═══════════════════════════════════════════════════════════
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get POS dashboard statistics
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalProducts:
                    type: integer
                  totalOrdersToday:
                    type: integer
                  totalRevenueToday:
                    type: number
                  recentOrders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════
  /users/my-account:
    get:
      tags: [Users]
      summary: Get current user profile
      parameters:
        - $ref: '#/components/parameters/withUsers'
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/columns'
        - $ref: '#/components/parameters/withUsers'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/notId'
        - name: username
          in: query
          schema:
            type: string
        - name: roleId
          in: query
          schema:
            type: integer
        - name: isActive
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: email
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user with profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, confirmPassword, isActive, roleId]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 255
                password:
                  type: string
                  maxLength: 255
                confirmPassword:
                  type: string
                isActive:
                  type: boolean
                roleId:
                  type: integer
                profile:
                  type: object
                  required: [fullName, placeOfBirth, dateOfBirth, gender]
                  properties:
                    fullName:
                      type: string
                      maxLength: 255
                    placeOfBirth:
                      type: string
                      maxLength: 255
                    dateOfBirth:
                      type: string
                      format: date
                    gender:
                      type: string
                      enum: [male, female]
                    imagePath:
                      type: string
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/get:
    post:
      tags: [Users]
      summary: List users (POST body-based filters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PaginationBody'
                - type: object
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                    username:
                      type: string
                    roleId:
                      type: integer
                    isActive:
                      type: boolean
                    email:
                      type: string
                    role:
                      type: string
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/profile/upload:
    post:
      tags: [Users]
      summary: Upload profile image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  imagePath:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/withUsers'
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, isActive, roleId]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 255
                isActive:
                  type: boolean
                roleId:
                  type: integer
                password:
                  type: string
                  maxLength: 255
                confirmPassword:
                  type: string
                oldPassword:
                  type: string
                profile:
                  type: object
                  required: [fullName, placeOfBirth, dateOfBirth, gender]
                  properties:
                    fullName:
                      type: string
                      maxLength: 255
                    placeOfBirth:
                      type: string
                      maxLength: 255
                    dateOfBirth:
                      type: string
                      format: date
                    gender:
                      type: string
                      enum: [male, female]
                    imagePath:
                      type: string
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Users]
      summary: Soft delete user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/permanently:
    delete:
      tags: [Users]
      summary: Permanently delete user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User permanently deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/restore:
    post:
      tags: [Users]
      summary: Restore soft-deleted user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════════════════════════
  # ROLES
  # ═══════════════════════════════════════════════════════════
  /roles:
    get:
      tags: [Roles]
      summary: List roles (paginated)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/columns'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/notId'
        - name: name
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: permissionId
          in: query
          schema:
            type: integer
        - name: with
          in: query
          schema:
            type: string
            enum: [users, permissions]
      responses:
        '200':
          description: Paginated role list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                permissionIds:
                  type: array
                  items:
                    type: integer
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  role:
                    $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles/get:
    post:
      tags: [Roles]
      summary: List roles (POST body-based filters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PaginationBody'
                - type: object
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                    name:
                      type: string
                    userId:
                      type: integer
                    permissionId:
                      type: integer
      responses:
        '200':
          description: Paginated role list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles/assign-permissions:
    post:
      tags: [Roles]
      summary: Assign or revoke permissions on a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                permissionIds:
                  type: array
                  items:
                    type: integer
                permissions:
                  type: array
                  items:
                    type: string
                addPermissions:
                  type: array
                  items:
                    type: string
                removePermissions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  role:
                    $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get role by ID
      parameters:
        - $ref: '#/components/parameters/id'
        - name: with
          in: query
          schema:
            type: string
            enum: [users, permissions]
      responses:
        '200':
          description: Role data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Roles]
      summary: Update role
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                permissionIds:
                  type: array
                  items:
                    type: integer
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  role:
                    $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Roles]
      summary: Delete role
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════════════════════════
  # PERMISSIONS
  # ═══════════════════════════════════════════════════════════
  /permissions:
    get:
      tags: [Permissions]
      summary: List permissions (paginated)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/columns'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/notId'
        - name: name
          in: query
          schema:
            type: string
        - name: roleId
          in: query
          schema:
            type: integer
        - name: with
          in: query
          schema:
            type: string
            enum: [roles]
      responses:
        '200':
          description: Paginated permission list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Permissions]
      summary: Create permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Permission created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  data:
                    $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions/get:
    post:
      tags: [Permissions]
      summary: List permissions (POST body-based filters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PaginationBody'
                - type: object
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                    name:
                      type: string
                    roleId:
                      type: integer
      responses:
        '200':
          description: Paginated permission list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions/check-valid-permissions:
    post:
      tags: [Permissions]
      summary: Check if a user has specific permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permissions]
              properties:
                userId:
                  type: integer
                permissions:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /permissions/{id}:
    get:
      tags: [Permissions]
      summary: Get permission by ID
      parameters:
        - $ref: '#/components/parameters/id'
        - name: with
          in: query
          schema:
            type: string
            enum: [roles]
      responses:
        '200':
          description: Permission data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Permissions]
      summary: Update permission
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Permission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success.
                  data:
                    $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Permissions]
      summary: Delete permission
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Permission deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════════════════════════════════════
  # PRODUCT CATEGORIES
  # ═══════════════════════════════════════════════════════════
  /product-categories:
    get:
      tags: [Product Categories]
      summary: List product categories (paginated)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/q'
        - name: with[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [products]
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductCategory'
                  - $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Product Categories]
      summary: Create product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
      responses:
        '201':
          description: Category created
          content:
            application/json:
