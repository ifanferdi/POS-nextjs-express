components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        example: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        example: 10
    orderBy:
      name: orderBy[]
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^\w+:(asc|desc)$'
        example: ['createdAt:desc']
      description: 'Array of field:direction pairs, e.g. id:asc or createdAt:desc'
    q:
      name: q
      in: query
      schema:
        type: string
      description: Search term
    columns:
      name: columns
      in: query
      schema:
        type: array
        items:
          type: string
      description: Fields to return
    ids:
      name: ids
      in: query
      schema:
        type: array
        items:
          type: integer
      description: Filter by IDs
    notId:
      name: notId
      in: query
      schema:
        type: integer
      description: Exclude by ID
    withUsers:
      name: with
      in: query
      schema:
        type: string
        enum: [profile, role, role.permissions, permissions]

  schemas:
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: Success.

    ErrorMessage:
      type: object
      properties:
        message:
          type: string
          example: Username atau password tidak valid.

    PaginatedMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    PaginationBody:
      type: object
      properties:
        page:
          type: integer
          default: 1
          example: 1
        limit:
          type: integer
          default: 10
          example: 10
        orderBy:
          type: array
          items:
            type: string
            pattern: '^\w+:(asc|desc)$'
          example: ['createdAt:desc']
        q:
          type: string
        columns:
          type: array
          items:
            type: string
        with:
          type: array
          items:
            type: string

    # ── Enums ────────────────────────────────────────────────
    OrderStatus:
      type: string
      enum: [pending, processing, completed, cancelled]
    PaymentMethod:
      type: string
      enum: [cash, card, qris, transfer]
    PaymentStatus:
      type: string
      enum: [pending, completed, failed, refunded]
    Gender:
      type: string
      enum: [male, female]

    # ── Profile ─────────────────────────────────────────────
    Profile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        fullName:
          type: string
        placeOfBirth:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        age:
          type: integer
        imagePath:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          nullable: true
        isActive:
          type: boolean
        roleId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        profile:
          $ref: '#/components/schemas/Profile'
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: object
            properties:
              permission:
                $ref: '#/components/schemas/Permission'

    # ── Role ────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # ── Permission ──────────────────────────────────────────
    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Product Category ────────────────────────────────────
    ProductCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    # ── Product ─────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        cost:
          type: number
          nullable: true
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        imagePath:
          type: string
          nullable: true
        imageUrl:
          type: string
        isActive:
          type: boolean
        stock:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'

    # ── Order ───────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        productId:
          type: integer
          nullable: true
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        product:
          $ref: '#/components/schemas/Product'

    Order:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
          nullable: true
        userId:
          type: integer
          nullable: true
        orderNumber:
          type: string
        subtotal:
          type: number
        tax:
          type: number
        discount:
          type: number
        total:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/User'
        user:
          $ref: '#/components/schemas/User'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

    # ── Payment ─────────────────────────────────────────────
    Payment:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        amount:
          type: number
        method:
